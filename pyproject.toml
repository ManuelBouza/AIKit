[project]
name = "aikit"
version = "0.2.0"
description = "Preferencias reproducibles de Codex y delegación a OpenCode"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Solo el servidor MCP necesita el SDK; la CLI sigue siendo stdlib.
mcp = ["mcp>=1.26,<2"]

[dependency-groups]
# El SDK entra en desarrollo para que `uv sync --locked` ejecute las pruebas
# MCP completas sin omitirlas.
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "mypy>=2.4.0", "mcp>=1.26,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["skills/delegating-to-opencode/scripts", "scripts"]
addopts = "-ra --strict-markers --strict-config --basetemp=.aikit/pytest-tmp"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".aikit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT", "ANN"]
# Any es válido en los límites JSON de la API; todas las funciones se anotan.
ignore = ["ANN401", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["skills/delegating-to-opencode/scripts/delegate.py", "skills/delegating-to-opencode/scripts/bound_execution.py", "skills/delegating-to-opencode/scripts/mcp_server.py", "skills/delegating-to-opencode/scripts/availability_state.py", "skills/delegating-to-opencode/scripts/availability_refresh.py", "skills/delegating-to-opencode/scripts/availability_policy.py", "skills/delegating-to-opencode/scripts/availability_performance.py", "skills/delegating-to-opencode/scripts/availability_public_terms.py", "skills/delegating-to-opencode/scripts/session_store.py", "skills/delegating-to-opencode/scripts/session_worker.py", "skills/delegating-to-opencode/scripts/session_stream.py", "skills/delegating-to-opencode/scripts/session_backend.py", "skills/delegating-to-opencode/scripts/service_identity.py", "skills/delegating-to-opencode/scripts/service_connection.py", "skills/delegating-to-opencode/scripts/host_registry.py", "scripts/build_plugin.py", "scripts/global_instructions.py", "scripts/install_go.py", "scripts/install_routing.py", "scripts/review_evidence.py", "tests"]
mypy_path = ["skills/delegating-to-opencode/scripts"]
cache_dir = ".aikit/mypy-cache"
