<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Notas de AIKit</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:light-dark(#f4f7fb,#151c29);color:light-dark(#172234,#e6edf6)}main{max-width:1500px;margin:auto;padding:24px}h1{margin:0}header p,.hint{color:light-dark(#58667b,#b3bfd0)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select{font:inherit;padding:9px;border:1px solid #8292a6;border-radius:7px;background:light-dark(#fff,#202c3d);color:inherit}input{flex:1;min-width:200px}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}.column{background:light-dark(#e7edf5,#1c293a);padding:12px;border-radius:10px}.column h2{font-size:1rem;margin:0 0 12px}.note{width:100%;text-align:left;font:inherit;color:inherit;background:light-dark(#fff,#29384b);border:1px solid light-dark(#d7e0eb,#485a70);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}.note:focus-visible{outline:3px solid #4b94ef}.number{display:block;font-size:.8rem;color:light-dark(#305b92,#add3ff);margin-bottom:5px}.summary{display:block;margin-top:6px;font-size:.85rem}.detail{margin-top:20px;padding:20px;background:light-dark(#fff,#202c3d);border-radius:10px;overflow-wrap:anywhere}.detail pre{overflow:auto}.detail table{border-collapse:collapse}.detail td,.detail th{border:1px solid #8292a6;padding:5px}.detail h2{font-size:1.25rem}@media(max-width:600px){main{padding:14px}.board{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:minmax(0,1fr)}.controls input,.controls select{width:100%;min-width:0}}
</style></head><body><main>
<header><h1>Notas de AIKit</h1><p>Consulta local · Generado: __GENERATED__ · incluye cambios sin commit</p><p class="hint">Las columnas reproducen las secciones del índice; algunas son históricas. Los enlaces e imágenes se muestran como texto.</p></header>
<div class="controls"><label for="search">Buscar</label><input id="search" type="search" placeholder="Número, título, estado o resumen"><label for="group">Sección</label><select id="group"><option value="">Todas</option></select></div>
<p id="count" aria-live="polite"></p><div id="board" class="board"></div><section class="detail" aria-live="polite"><h2 id="detail-title">Selecciona una nota</h2><div id="detail-content"></div></section>
</main><script>
const notes=__NOTES_JSON__;
const board=document.getElementById('board'), search=document.getElementById('search'), group=document.getElementById('group'), count=document.getElementById('count');
let selectedNumber=null;
const groups=[...new Set(notes.map(n=>n.group))];
for(const name of groups){const option=document.createElement('option');option.value=name;option.textContent=name;group.append(option)}
function draw(){board.replaceChildren();const q=search.value.toLocaleLowerCase('es');let total=0;for(const name of groups){if(group.value&&group.value!==name)continue;const selected=notes.filter(n=>n.group===name&&[n.number,n.title,n.status,n.summary].join(' ').toLocaleLowerCase('es').includes(q));if(!selected.length)continue;total+=selected.length;const section=document.createElement('section');section.className='column';const heading=document.createElement('h2');heading.textContent=name;section.append(heading);for(const n of selected){const button=document.createElement('button');button.className='note';button.type='button';const tag=document.createElement('span');tag.className='number';tag.textContent=n.number+' · '+n.status;const title=document.createElement('strong');title.textContent=n.title;const summary=document.createElement('span');summary.className='summary';summary.textContent=n.summary;button.append(tag,title,summary);button.addEventListener('click',()=>{selectedNumber=n.number;document.getElementById('detail-title').textContent=n.number+' · '+n.title;document.getElementById('detail-content').innerHTML=n.content;});section.append(button)}board.append(section)}if(selectedNumber&&!notes.some(n=>n.number===selectedNumber&&(!group.value||n.group===group.value)&&[n.number,n.title,n.status,n.summary].join(' ').toLocaleLowerCase('es').includes(q))){selectedNumber=null;document.getElementById('detail-title').textContent='Selecciona una nota';document.getElementById('detail-content').replaceChildren()}count.textContent=total?`${total} de ${notes.length} notas`:'No hay coincidencias.'}
search.addEventListener('input',draw);group.addEventListener('change',draw);draw();
</script></body></html>
