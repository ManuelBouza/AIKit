<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ideas y tareas de AIKit</title>
<style>
[hidden]{display:none!important}:root{color-scheme:light dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:light-dark(#f4f7fb,#151c29);color:light-dark(#172234,#e6edf6)}main{max-width:1500px;margin:auto;padding:24px}h1{margin:0}header p,.hint{color:light-dark(#58667b,#b3bfd0)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select{font:inherit;padding:9px;border:1px solid #8292a6;border-radius:7px;background:light-dark(#fff,#202c3d);color:inherit}input{flex:1;min-width:200px}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}.column{background:light-dark(#e7edf5,#1c293a);padding:12px;border-radius:10px}.column h2{font-size:1rem;margin:0 0 12px}.note{width:100%;text-align:left;font:inherit;color:inherit;background:light-dark(#fff,#29384b);border:1px solid light-dark(#d7e0eb,#485a70);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}.note:focus-visible{outline:3px solid #4b94ef}.number{display:block;font-size:.8rem;color:light-dark(#305b92,#add3ff);margin-bottom:5px}.summary{display:block;margin-top:6px;font-size:.85rem}.detail{margin-top:20px;padding:20px;background:light-dark(#fff,#202c3d);border-radius:10px;overflow-wrap:anywhere}.detail pre{overflow:auto}.detail table{border-collapse:collapse}.detail td,.detail th{border:1px solid #8292a6;padding:5px}.detail h2{font-size:1.25rem}@media(max-width:600px){main{padding:14px}.board{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:minmax(0,1fr)}.controls input,.controls select{width:100%;min-width:0}}
</style></head><body><main>
<header><h1>Ideas y tareas de AIKit</h1><p>Consulta local · Generado: __GENERATED__ · incluye cambios sin commit</p><p class="hint">Las columnas reproducen las secciones del índice; algunas son históricas. Los enlaces e imágenes se muestran como texto.</p></header>
<nav aria-label="Vistas"><button id="ideas-view" type="button" aria-pressed="true">Ideas</button> <button id="tasks-view" type="button" aria-pressed="false">Tareas</button></nav>
<div id="task-controls" class="controls" hidden><label for="phase">Fase</label><select id="phase"><option value="">Todas</option></select><label for="attention">Atención</label><select id="attention"><option value="">Todas</option></select><label for="owner">Responsable</label><select id="owner"><option value="">Todos</option></select><label for="idea">Idea</label><select id="idea"><option value="">Todas</option></select></div>
<div class="controls"><label for="search">Buscar</label><input id="search" type="search" placeholder="Número, título, estado o resumen"><label for="group">Sección</label><select id="group"><option value="">Todas</option></select></div>
<p id="count" aria-live="polite"></p><div id="board" class="board"></div><section class="detail" aria-live="polite"><h2 id="detail-title">Selecciona una nota</h2><div id="detail-content"></div></section>
</main><script>
const notes=__NOTES_JSON__;
const tasks=__TASKS_JSON__;
const board=document.getElementById('board'), search=document.getElementById('search'), group=document.getElementById('group'), count=document.getElementById('count');
let selectedNumber=null;
let selectedTask=null;
let view="ideas";
const groups=[...new Set(notes.map(n=>n.group))];
for(const name of groups){const option=document.createElement('option');option.value=name;option.textContent=name;group.append(option)}
function draw(){if(view==="tasks"){drawTasks();return}board.replaceChildren();const q=search.value.toLocaleLowerCase('es');let total=0;for(const name of groups){if(group.value&&group.value!==name)continue;const selected=notes.filter(n=>n.group===name&&[n.number,n.title,n.status,n.summary].join(' ').toLocaleLowerCase('es').includes(q));if(!selected.length)continue;total+=selected.length;const section=document.createElement('section');section.className='column';const heading=document.createElement('h2');heading.textContent=name;section.append(heading);for(const n of selected){const button=document.createElement('button');button.className='note';button.type='button';const tag=document.createElement('span');tag.className='number';tag.textContent=n.number+' · '+n.status;const title=document.createElement('strong');title.textContent=n.title;const summary=document.createElement('span');summary.className='summary';summary.textContent=n.summary;button.append(tag,title,summary);button.addEventListener('click',()=>{selectedNumber=n.number;document.getElementById('detail-title').textContent=n.number+' · '+n.title;showNote(n);});section.append(button)}board.append(section)}if(selectedNumber&&!notes.some(n=>n.number===selectedNumber&&(!group.value||n.group===group.value)&&[n.number,n.title,n.status,n.summary].join(' ').toLocaleLowerCase('es').includes(q))){selectedNumber=null;document.getElementById('detail-title').textContent='Selecciona una nota';document.getElementById('detail-content').replaceChildren()}count.textContent=total?`${total} de ${notes.length} notas`:'No hay coincidencias.'}
const phase=document.getElementById('phase'),attention=document.getElementById('attention'),owner=document.getElementById('owner'),idea=document.getElementById('idea');
for(const [select,values] of [[phase,tasks.map(t=>t.fase)],[attention,tasks.map(t=>t.atencion)],[owner,tasks.map(t=>t.responsable)],[idea,notes.map(n=>n.number)]]){for(const value of [...new Set(values)]){const option=document.createElement('option');option.value=value;option.textContent=value.replaceAll('_',' ');select.append(option)}select.addEventListener('change',draw)}
function changeView(value){selectedTask=null;selectedNumber=null;view=value;document.getElementById('task-controls').hidden=view!=='tasks';group.disabled=view==='tasks';document.getElementById('ideas-view').setAttribute('aria-pressed',view==='ideas');document.getElementById('tasks-view').setAttribute('aria-pressed',view==='tasks');document.getElementById('detail-title').textContent='Selecciona una '+(view==='ideas'?'idea':'tarea');document.getElementById('detail-content').replaceChildren();draw()}
document.getElementById('ideas-view').addEventListener('click',()=>changeView('ideas'));
document.getElementById('tasks-view').addEventListener('click',()=>changeView('tasks'));
function relation(container,label,callback){const button=document.createElement('button');button.type='button';button.textContent=label;button.addEventListener('click',callback);container.append(button)}
function showNote(n){selectedNumber=n.number;const content=document.getElementById('detail-content');content.innerHTML=n.content;const heading=document.createElement('h3');heading.textContent='Tareas vinculadas';content.append(heading);for(const t of tasks.filter(t=>t.ideas.includes(Number(n.number))))relation(content,t.id+' · '+t.titulo+' · '+t.fase,()=>{changeView('tasks');showTask(t)})}
function showTask(t){selectedTask=t.id;document.getElementById('detail-title').textContent=t.id+' · '+t.titulo;const content=document.getElementById('detail-content');content.replaceChildren();for(const [label,value] of [['Fase',t.fase],['Atención',t.atencion],['Responsable',t.responsable],['Chat',t.chat||'Sin asignar'],['Motivo',t.motivo],['Siguiente acción',t.siguienteAccion],['Origen',t.origen],['Autorización',t.autorizacion.estado+' · '+t.autorizacion.alcance+' · '+t.autorizacion.referencia]]){const p=document.createElement('p');p.textContent=label+': '+value;content.append(p)}for(const number of t.ideas){const n=notes.find(n=>Number(n.number)===number);relation(content,'Idea '+n.number+' · '+n.title,()=>{changeView('ideas');document.getElementById('detail-title').textContent=n.number+' · '+n.title;showNote(n)})}const heading=document.createElement('h3');heading.textContent='Dependencias';content.append(heading);for(const id of t.dependencias){const dependency=tasks.find(t=>t.id===id);relation(content,id+' · '+dependency.titulo+' · '+dependency.fase+' · '+dependency.atencion,()=>showTask(dependency))}const evidence=document.createElement('h3');evidence.textContent='Referencias (sin apertura ni comprobación de red)';content.append(evidence);for(const r of t.referencias){const p=document.createElement('p');p.textContent=r.etiqueta+' · '+r.destino;content.append(p)}const body=document.createElement('div');body.innerHTML=t.content;content.append(body)}
function drawTasks(){board.replaceChildren();const q=search.value.toLocaleLowerCase('es');const selected=tasks.filter(t=>(!phase.value||phase.value===t.fase)&&(!attention.value||attention.value===t.atencion)&&(!owner.value||owner.value===t.responsable)&&(!idea.value||t.ideas.includes(Number(idea.value)))&&[t.id,t.titulo,t.responsable,t.fase,t.atencion,t.origen].join(' ').toLocaleLowerCase('es').includes(q));for(const t of selected){const button=document.createElement('button');button.type='button';button.className='note';const tag=document.createElement('span');tag.className='number';tag.textContent=t.id+' · '+t.fase+' · '+t.atencion;const title=document.createElement('strong');title.textContent=t.titulo;const summary=document.createElement('span');summary.className='summary';summary.textContent=t.responsable+' · '+t.siguienteAccion;button.append(tag,title,summary);button.addEventListener('click',()=>showTask(t));board.append(button)}if(selectedTask&&!selected.some(t=>t.id===selectedTask)){selectedTask=null;document.getElementById('detail-title').textContent='Selecciona una tarea';document.getElementById('detail-content').replaceChildren()}count.textContent=selected.length+' de '+tasks.length+' tareas'}
search.addEventListener('input',draw);group.addEventListener('change',draw);draw();
</script></body></html>
