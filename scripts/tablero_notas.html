<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ideas y tareas de AIKit</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:light dark;font-family:system-ui,sans-serif;--ink:light-dark(#182a43,#eff5ff);--muted:light-dark(#536780,#bccbe0);--paper:light-dark(#f4f7fc,#101c2d);--card:light-dark(#fff,#20334d);--line:light-dark(#d4dfed,#4a617e);--accent:light-dark(#b65014,#ffb46e)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{max-width:1500px;margin:auto;padding:clamp(18px,4vw,48px)}header{border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.04em;margin:0}header p,.hint{color:var(--muted);margin:.5rem 0 0;line-height:1.5}nav{display:flex;gap:8px;margin:24px 0 0}button,input,select{font:inherit;color:inherit}button{cursor:pointer}nav button,.clear,.close{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px}nav button[aria-pressed=true]{background:var(--accent);color:light-dark(#fff,#291507);border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #db9834;outline-offset:3px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}.controls label{font-size:.9rem;font-weight:650;color:var(--muted)}input,select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);min-width:0}input{flex:1;min-width:200px}#count{color:var(--muted);font-size:.9rem}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;align-items:start}.column{background:light-dark(#e6edf7,#182a42);padding:14px;border-radius:14px;min-width:0}.column h2{font-size:.95rem;margin:0 0 14px;line-height:1.4}.note{display:block;width:100%;text-align:left;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 3px 12px #172c4a0a;overflow-wrap:anywhere}.note:hover{border-color:var(--accent);transform:translateY(-1px)}.note strong{line-height:1.35}.number{display:block;font-size:.76rem;font-weight:700;color:var(--accent);margin-bottom:8px}.summary{display:block;margin-top:8px;font-size:.88rem;color:var(--muted);line-height:1.45}.detail{width:min(760px,calc(100% - 32px));max-height:calc(100% - 32px);border:1px solid var(--line);border-radius:18px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 24px 70px #0005;overflow:auto;overflow-wrap:anywhere}.detail::backdrop{background:#08182bc0}.detail-header{position:sticky;top:0;display:flex;gap:16px;justify-content:space-between;align-items:start;background:var(--card);border-bottom:1px solid var(--line);padding:22px;z-index:1}.detail h2{font-size:1.3rem;line-height:1.3;margin:0}.close{flex:none}.detail-body{padding:22px;line-height:1.6}.detail-body pre{max-width:100%;overflow:auto}.detail-body table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}.detail-body td,.detail-body th{border:1px solid var(--line);padding:6px}.detail-body button{display:block;max-width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow-wrap:anywhere}@media(max-width:600px){main{padding:16px}.board{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}.controls input,.controls select{width:100%;min-width:0}.detail-header,.detail-body{padding:16px}.detail-header{align-items:center}.detail h2{font-size:1.1rem}}
</style></head><body><main>
<header><h1>Ideas y tareas de AIKit</h1><p>Consulta local · Generado: __GENERATED__ · incluye cambios sin commit</p><p class="hint">Las columnas reproducen las secciones del índice; algunas son históricas. Los enlaces e imágenes se muestran como texto.</p></header>
<nav aria-label="Vistas"><button id="ideas-view" type="button" aria-pressed="true">Ideas</button> <button id="tasks-view" type="button" aria-pressed="false">Tareas</button></nav>
<div id="task-controls" class="controls" hidden><label for="phase">Fase</label><select id="phase"><option value="">Todas</option></select><label for="attention">Atención</label><select id="attention"><option value="">Todas</option></select><label for="owner">Responsable</label><select id="owner"><option value="">Todos</option></select><label for="idea">Idea</label><select id="idea"><option value="">Todas</option></select></div>
<div class="controls"><label for="search">Buscar</label><input id="search" type="search" placeholder="Número, título, estado o resumen"><label for="group">Sección</label><select id="group"><option value="">Todas</option></select></div>
<p id="count" aria-live="polite"></p><button id="clear" class="clear" type="button" hidden>Limpiar filtros</button><div id="board" class="board"></div><dialog id="detail" class="detail" aria-labelledby="detail-title"><div class="detail-header"><h2 id="detail-title" tabindex="-1"></h2><button id="close-detail" class="close" type="button" aria-label="Cerrar detalle">Cerrar</button></div><div id="detail-content" class="detail-body"></div></dialog>
</main><script>
const notes=__NOTES_JSON__;
const tasks=__TASKS_JSON__;
const board=document.getElementById('board'), search=document.getElementById('search'), group=document.getElementById('group'), count=document.getElementById('count');
const dialog=document.getElementById('detail'), detailTitle=document.getElementById('detail-title'), clear=document.getElementById('clear');
let returnFocus=null;
function openDetail(){if(!dialog.open){returnFocus=document.activeElement;dialog.showModal()}detailTitle.focus()}
document.getElementById('close-detail').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>{if(returnFocus&&returnFocus.isConnected&&!returnFocus.disabled) returnFocus.focus();else document.getElementById(view==='ideas'?'ideas-view':'tasks-view').focus();returnFocus=null});
clear.addEventListener('click',()=>{search.value='';if(view==='ideas')group.value='';else for(const control of [phase,attention,owner,idea])control.value='';draw();search.focus()});
let selectedNumber=null;
let selectedTask=null;
let view="ideas";
const groups=[...new Set(notes.map(n=>n.group))];
for(const name of groups){const option=document.createElement('option');option.value=name;option.textContent=name;group.append(option)}
function draw(){if(view==="tasks"){drawTasks();return}board.replaceChildren();const q=search.value.toLocaleLowerCase('es');let total=0;for(const name of groups){if(group.value&&group.value!==name)continue;const selected=notes.filter(n=>n.group===name&&[n.number,n.title,n.status,n.summary].join(' ').toLocaleLowerCase('es').includes(q));if(!selected.length)continue;total+=selected.length;const section=document.createElement('section');section.className='column';const heading=document.createElement('h2');heading.textContent=name+' · '+selected.length;section.append(heading);for(const n of selected){const button=document.createElement('button');button.className='note';button.type='button';const tag=document.createElement('span');tag.className='number';tag.textContent=n.number+' · '+n.status;const title=document.createElement('strong');title.textContent=n.title;const summary=document.createElement('span');summary.className='summary';summary.textContent=n.summary;button.append(tag,title,summary);button.addEventListener('click',()=>{selectedNumber=n.number;document.getElementById('detail-title').textContent=n.number+' · '+n.title;showNote(n);openDetail();});section.append(button)}board.append(section)}if(selectedNumber&&!notes.some(n=>n.number===selectedNumber&&(!group.value||n.group===group.value)&&[n.number,n.title,n.status,n.summary].join(' ').toLocaleLowerCase('es').includes(q))){selectedNumber=null;document.getElementById('detail-title').textContent='Selecciona una nota';document.getElementById('detail-content').replaceChildren()}count.textContent=!notes.length?'No hay ideas disponibles.':total?`${total} de ${notes.length} notas`:'No hay coincidencias. Prueba a limpiar los filtros.';clear.hidden=total>0||!notes.length}
const phase=document.getElementById('phase'),attention=document.getElementById('attention'),owner=document.getElementById('owner'),idea=document.getElementById('idea');
for(const [select,values] of [[phase,tasks.map(t=>t.fase)],[attention,tasks.map(t=>t.atencion)],[owner,tasks.map(t=>t.responsable)],[idea,notes.map(n=>n.number)]]){for(const value of [...new Set(values)]){const option=document.createElement('option');option.value=value;option.textContent=value.replaceAll('_',' ');select.append(option)}select.addEventListener('change',draw)}
function changeView(value){selectedTask=null;selectedNumber=null;view=value;document.getElementById('task-controls').hidden=view!=='tasks';group.disabled=view==='tasks';document.getElementById('ideas-view').setAttribute('aria-pressed',view==='ideas');document.getElementById('tasks-view').setAttribute('aria-pressed',view==='tasks');document.getElementById('detail-title').textContent='Selecciona una '+(view==='ideas'?'idea':'tarea');document.getElementById('detail-content').replaceChildren();draw()}
document.getElementById('ideas-view').addEventListener('click',()=>changeView('ideas'));
document.getElementById('tasks-view').addEventListener('click',()=>changeView('tasks'));
function relation(container,label,callback){const button=document.createElement('button');button.type='button';button.textContent=label;button.addEventListener('click',callback);container.append(button)}
function showNote(n){selectedNumber=n.number;detailTitle.textContent=n.number+' · '+n.title;const content=document.getElementById('detail-content');content.innerHTML=n.content;const heading=document.createElement('h3');heading.textContent='Tareas vinculadas';content.append(heading);for(const t of tasks.filter(t=>t.ideas.includes(Number(n.number))))relation(content,t.id+' · '+t.titulo+' · '+t.fase,()=>{changeView('tasks');showTask(t);detailTitle.focus()})}
function showTask(t){selectedTask=t.id;document.getElementById('detail-title').textContent=t.id+' · '+t.titulo;const content=document.getElementById('detail-content');content.replaceChildren();for(const [label,value] of [['Fase',t.fase],['Atención',t.atencion],['Responsable',t.responsable],['Chat',t.chat||'Sin asignar'],['Motivo',t.motivo],['Siguiente acción',t.siguienteAccion],['Origen',t.origen],['Autorización',t.autorizacion.estado+' · '+t.autorizacion.alcance+' · '+t.autorizacion.referencia]]){const p=document.createElement('p');p.textContent=label+': '+value;content.append(p)}for(const number of t.ideas){const n=notes.find(n=>Number(n.number)===number);relation(content,'Idea '+n.number+' · '+n.title,()=>{changeView('ideas');document.getElementById('detail-title').textContent=n.number+' · '+n.title;showNote(n);detailTitle.focus()})}const heading=document.createElement('h3');heading.textContent='Dependencias';content.append(heading);for(const id of t.dependencias){const dependency=tasks.find(t=>t.id===id);relation(content,id+' · '+dependency.titulo+' · '+dependency.fase+' · '+dependency.atencion,()=>{showTask(dependency);detailTitle.focus()})}const evidence=document.createElement('h3');evidence.textContent='Referencias (sin apertura ni comprobación de red)';content.append(evidence);for(const r of t.referencias){const p=document.createElement('p');p.textContent=r.etiqueta+' · '+r.destino;content.append(p)}const body=document.createElement('div');body.innerHTML=t.content;content.append(body)}
function drawTasks(){board.replaceChildren();const q=search.value.toLocaleLowerCase('es');const selected=tasks.filter(t=>(!phase.value||phase.value===t.fase)&&(!attention.value||attention.value===t.atencion)&&(!owner.value||owner.value===t.responsable)&&(!idea.value||t.ideas.includes(Number(idea.value)))&&[t.id,t.titulo,t.responsable,t.fase,t.atencion,t.origen].join(' ').toLocaleLowerCase('es').includes(q));for(const t of selected){const button=document.createElement('button');button.type='button';button.className='note';const tag=document.createElement('span');tag.className='number';tag.textContent=t.id+' · '+t.fase+' · '+t.atencion;const title=document.createElement('strong');title.textContent=t.titulo;const summary=document.createElement('span');summary.className='summary';summary.textContent=t.responsable+' · '+t.siguienteAccion;button.append(tag,title,summary);button.addEventListener('click',()=>{showTask(t);openDetail()});board.append(button)}if(selectedTask&&!selected.some(t=>t.id===selectedTask)){selectedTask=null;document.getElementById('detail-title').textContent='Selecciona una tarea';document.getElementById('detail-content').replaceChildren()}count.textContent=!tasks.length?'No hay tareas disponibles.':selected.length?selected.length+' de '+tasks.length+' tareas':'No hay coincidencias. Prueba a limpiar los filtros.';clear.hidden=selected.length>0||!tasks.length}
search.addEventListener('input',draw);group.addEventListener('change',draw);draw();
</script></body></html>
